<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — AniMain</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">🎌 AniMain</div>
    <div class="sidebar-section">Navigate</div>
    <a href="index.html" class="sidebar-link"><span class="icon">🏠</span>Home</a>
    <a href="search.html?filter=airing" class="sidebar-link"><span class="icon">📡</span>Airing</a>
    <a href="search.html?filter=top" class="sidebar-link"><span class="icon">🏆</span>Top Anime</a>
    <a href="search.html?filter=popular" class="sidebar-link"><span class="icon">🔥</span>Popular</a>
    <a href="search.html?filter=upcoming" class="sidebar-link"><span class="icon">📅</span>Upcoming</a>
    <div class="sidebar-section">Genres</div>
    <div class="sidebar-genres">
      <div class="sidebar-genre" onclick="location.href='search.html?genre=1&name=Action'">Action</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=2&name=Adventure'">Adventure</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=4&name=Comedy'">Comedy</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=8&name=Drama'">Drama</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=10&name=Fantasy'">Fantasy</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=22&name=Romance'">Romance</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=24&name=Sci-Fi'">Sci-Fi</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=37&name=Supernatural'">Supernatural</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=7&name=Mystery'">Mystery</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=27&name=Shounen'">Shounen</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=36&name=Slice+of+Life'">Slice of Life</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=14&name=Horror'">Horror</div>
    </div>
    <div class="sidebar-footer">
      <div>🎌 AniMain</div>
      <div class="credit">Made by trentyn</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <a href="index.html" class="topbar-logo">🎌 AniMain</a>
      <form class="search-wrap" id="search-form">
        <input type="text" id="search-input" placeholder="Search anime..." autocomplete="off">
        <button type="submit">🔍</button>
      </form>
    </div>

    <div class="search-page">
      <div id="search-heading" class="search-hd"></div>
      <div class="anime-grid" id="results-grid"></div>
      <div id="pagination" style="text-align:center;margin-top:2rem;display:none">
        <button id="load-more" class="load-more-btn">Load More</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { searchAnime, getTopAnime, getTopAiring, getPopular, getUpcoming, getAnimeByGenre, getSeasonNow } from './js/api.js';

const params  = new URLSearchParams(location.search);
const query   = params.get('q');
const filter  = params.get('filter');
const genreId = params.get('genre');
const genreName = params.get('name');

let currentPage = 1, hasMore = false;

const heading     = document.getElementById('search-heading');
const grid        = document.getElementById('results-grid');
const pagination  = document.getElementById('pagination');
const loadMoreBtn = document.getElementById('load-more');

function esc(s = '') { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cardHTML(anime) {
  const img   = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url;
  const title = anime.title_english || anime.title;
  const score = anime.score ? `⭐ ${anime.score}` : '';
  const eps   = anime.episodes ? `${anime.episodes} eps` : anime.status === 'Currently Airing' ? 'Ongoing' : '';
  return `
    <div class="anime-card" onclick="location.href='anime.html?id=${anime.mal_id}'">
      <div class="card-img-wrap">
        ${img ? `<img class="card-img" src="${img}" alt="${esc(title)}" loading="lazy">` : `<div class="card-img-placeholder">🎌</div>`}
      </div>
      <div class="card-info">
        <div class="card-title">${esc(title)}</div>
        <div class="card-meta">${[score, eps].filter(Boolean).join(' · ')}</div>
        ${anime.status === 'Currently Airing' ? '<span class="card-badge">● AIRING</span>' : ''}
      </div>
    </div>`;
}

function skeletons(n) { return Array(n).fill('<div class="skeleton"></div>').join(''); }

// highlight active sidebar link
document.querySelectorAll('.sidebar-link').forEach(l => {
  if (l.href === location.href) l.classList.add('active');
});

async function load(append = false) {
  if (!append) grid.innerHTML = skeletons(12);
  else loadMoreBtn.textContent = 'Loading...';
  try {
    let items = [];
    if (query) {
      const data = await searchAnime(query, currentPage);
      items = data.data; hasMore = data.pagination?.has_next_page;
      heading.innerHTML = `Results for <span>"${esc(query)}"</span> — ${data.pagination?.items?.total || 0} found`;
    } else if (genreId) {
      items = await getAnimeByGenre(genreId, currentPage);
      heading.innerHTML = `Genre: <span>${esc(genreName || genreId)}</span>`;
      hasMore = items.length === 18;
    } else if (filter === 'top')      { items = await getTopAnime();    heading.innerHTML = `<span>Top Rated</span> Anime`; }
    else if (filter === 'airing')     { items = await getTopAiring();   heading.innerHTML = `<span>Currently Airing</span>`; }
    else if (filter === 'popular')    { items = await getPopular();     heading.innerHTML = `<span>Most Popular</span>`; }
    else if (filter === 'upcoming')   { items = await getUpcoming();    heading.innerHTML = `<span>Upcoming</span> Anime`; }
    else if (filter === 'season')     { items = await getSeasonNow();   heading.innerHTML = `<span>This Season</span>`; }
    else { items = await getPopular(); heading.innerHTML = 'Browse Anime'; }

    const html = items.length
      ? items.map(cardHTML).join('')
      : `<div class="no-results" style="grid-column:1/-1"><div class="icon">😔</div><p>No results found.</p></div>`;

    append ? grid.insertAdjacentHTML('beforeend', html) : (grid.innerHTML = html);
    pagination.style.display = hasMore ? 'block' : 'none';
    loadMoreBtn.textContent = 'Load More';
  } catch {
    grid.innerHTML = `<p style="color:var(--muted);grid-column:1/-1;padding:2rem">Error loading results. Try again.</p>`;
  }
}

loadMoreBtn.addEventListener('click', () => { currentPage++; load(true); });

if (query) document.getElementById('search-input').value = query;
document.getElementById('search-form').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('search-input').value.trim();
  if (q) location.href = `search.html?q=${encodeURIComponent(q)}`;
});

load();
</script>
</body>
</html>
