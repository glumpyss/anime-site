<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — AniMain</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">🎌 AniMain</div>
    <div class="sidebar-section">Navigate</div>
    <a href="index.html" class="sidebar-link"><span class="icon">🏠</span>Home</a>
    <a href="search.html?filter=airing" class="sidebar-link"><span class="icon">📡</span>Airing</a>
    <a href="search.html?filter=top" class="sidebar-link"><span class="icon">🏆</span>Top Anime</a>
    <a href="search.html?filter=popular" class="sidebar-link"><span class="icon">🔥</span>Popular</a>
    <a href="search.html?filter=upcoming" class="sidebar-link"><span class="icon">📅</span>Upcoming</a>
    <div class="sidebar-section">Genres</div>
    <div class="sidebar-genres">
      <div class="sidebar-genre" onclick="location.href='search.html?genre=1&name=Action'">Action</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=2&name=Adventure'">Adventure</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=4&name=Comedy'">Comedy</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=8&name=Drama'">Drama</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=10&name=Fantasy'">Fantasy</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=22&name=Romance'">Romance</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=24&name=Sci-Fi'">Sci-Fi</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=37&name=Supernatural'">Supernatural</div>
      <div class="sidebar-genre" onclick="location.href='search.html?genre=7&name=Mystery'">Mystery</div>
    </div>
    <div class="sidebar-footer">
      <div>🎌 AniMain</div>
      <div class="credit">Made by trentyn</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <a href="index.html" class="topbar-logo">🎌 AniMain</a>
      <form class="search-wrap" id="search-form">
        <input type="text" id="search-input" placeholder="Search anime..." autocomplete="off">
        <button type="submit">🔍</button>
      </form>
    </div>

    <div id="page-content">
      <div class="loading-center">
        <div class="spinner"></div>
        <p>Loading anime...</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { getAnimeById, getAnimeEpisodes } from './js/api.js';
import { renderPlayer, renderServerTabs, updatePlayer } from './js/player.js';

const params = new URLSearchParams(location.search);
const id = params.get('id');
const page = document.getElementById('page-content');

function esc(str = '') {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

if (!id) {
  page.innerHTML = `<div class="no-results"><div class="icon">❓</div><p>No anime ID provided.</p></div>`;
} else {
  init(id);
}

async function init(malId) {
  try {
    const anime = await getAnimeById(malId);
    const epsData = await getAnimeEpisodes(malId, 1);

    document.title = `${anime.title_english || anime.title} — AniMain`;

    const title = anime.title_english || anime.title;
    const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url;
    const totalEps = anime.episodes || epsData?.pagination?.items?.total || '?';
    const eps = epsData?.data || [];

    let epNums = eps.map(e => e.mal_id);
    if (!epNums.length && typeof anime.episodes === 'number') {
      epNums = Array.from({ length: anime.episodes }, (_, i) => i + 1);
    }
    if (!epNums.length) epNums = [1];

    let currentEp = parseInt(params.get('ep')) || epNums[0];

    page.innerHTML = `
      <div class="watch-layout">

        <!-- LEFT COLUMN -->
        <div>
          <!-- Player -->
          <div class="player-box" id="player-box"></div>

          <!-- Servers -->
          <div id="server-container"></div>

          <!-- Episode list -->
          <div class="ep-section" style="margin-top:0.8rem">
            <div class="ep-section-hd">
              <span>Episodes${totalEps !== '?' ? ' — ' + totalEps + ' total' : ''}</span>
              ${epsData?.pagination?.has_next_page
                ? `<span id="load-more-eps" style="color:var(--g);cursor:pointer;font-size:0.78rem">Load More ↓</span>`
                : ''}
            </div>
            <div class="ep-grid" id="ep-grid">
              ${epNums.map(n => `<button class="ep-btn ${n === currentEp ? 'active' : ''}" data-ep="${n}">${n}</button>`).join('')}
            </div>
          </div>

          <!-- Anime info -->
          <div class="anime-info">
            ${img ? `<img class="info-poster" src="${img}" alt="${esc(title)}">` : ''}
            <div>
              <div class="info-title">${esc(title)}</div>
              ${anime.title !== title ? `<div style="color:var(--muted);font-size:0.82rem;margin-bottom:0.5rem">${esc(anime.title)}</div>` : ''}
              <div class="info-badges">
                ${anime.score ? `<span class="badge green">⭐ ${anime.score}</span>` : ''}
                ${anime.status ? `<span class="badge">${esc(anime.status)}</span>` : ''}
                ${anime.year ? `<span class="badge">${anime.year}</span>` : ''}
                ${anime.episodes ? `<span class="badge">${anime.episodes} eps</span>` : ''}
              </div>
              ${anime.genres?.length ? `
                <div class="info-genres">
                  ${anime.genres.map(g =>
                    `<a href="search.html?genre=${g.mal_id}&name=${encodeURIComponent(g.name)}" class="genre-chip">${esc(g.name)}</a>`
                  ).join('')}
                </div>` : ''}
              <p class="info-synopsis">${esc(anime.synopsis || 'No synopsis available.')}</p>
            </div>
          </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="watch-sidebar">
          <!-- Side ep list -->
          <div class="info-card">
            <div class="info-card-hd">Episodes</div>
            <div class="ep-grid" style="max-height:300px;overflow-y:auto;padding:0.6rem" id="ep-grid-side">
              ${epNums.slice(0, 100).map(n => `<button class="ep-btn ${n === currentEp ? 'active' : ''}" data-ep="${n}">${n}</button>`).join('')}
            </div>
          </div>

          <!-- Related -->
          ${anime.related?.length ? `
            <div class="info-card">
              <div class="info-card-hd">Related</div>
              <div class="related-list">
                ${anime.related.slice(0, 8).map(r => `
                  <a href="${r.entry?.[0]?.type === 'anime' ? 'anime.html?id=' + r.entry[0].mal_id : '#'}" class="related-item">
                    <span>${esc(r.entry?.[0]?.name || '')}</span>
                    <span class="related-rel">${esc(r.relation)}</span>
                  </a>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>

      </div>
    `;

    // Render player + servers
    renderPlayer(document.getElementById('player-box'), anime, currentEp);
    renderServerTabs(document.getElementById('server-container'), anime, currentEp);

    // Episode button clicks
    document.querySelectorAll('.ep-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentEp = parseInt(btn.dataset.ep);
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll(`[data-ep="${currentEp}"]`).forEach(b => b.classList.add('active'));
        updatePlayer(anime, currentEp);
        renderServerTabs(document.getElementById('server-container'), anime, currentEp);
        const u = new URL(location.href);
        u.searchParams.set('ep', currentEp);
        history.replaceState(null, '', u);
        document.getElementById('player-box')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // Load more episodes
    document.getElementById('load-more-eps')?.addEventListener('click', async () => {
      const more = await getAnimeEpisodes(malId, 2);
      const nums = more?.data?.map(e => e.mal_id) || [];
      const grid = document.getElementById('ep-grid');
      nums.forEach(n => {
        const b = document.createElement('button');
        b.className = 'ep-btn'; b.dataset.ep = n; b.textContent = n;
        b.addEventListener('click', () => {
          currentEp = n;
          document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          updatePlayer(anime, n);
          renderServerTabs(document.getElementById('server-container'), anime, n);
        });
        grid.appendChild(b);
      });
      document.getElementById('load-more-eps')?.remove();
    });

  } catch (err) {
    page.innerHTML = `<div class="no-results"><div class="icon">❌</div><p>Failed to load. Check your connection and try again.</p></div>`;
    console.error(err);
  }
}

document.getElementById('search-form').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('search-input').value.trim();
  if (q) location.href = `search.html?q=${encodeURIComponent(q)}`;
});
</script>
</body>
</html>
